name:                game-frontend
version:             0.1.0.0
synopsis:            A Haskell Game Frontend using Gloss
description:         Multiplayer game frontend built with the Gloss library
license:             MIT
author:              Developer
maintainer:          dev@example.com

dependencies:
  - base >= 4.7 && < 5
  - gloss
  - containers
  - network
  - stm
  - bytestring
  - directory
  - process

library:
  source-dirs: src
  exposed-modules:
    - Types
    - GameLogic
    - NetworkClient
    - Server
    - Render.Core
    - Render.Map
    - Render.UI
    - Render.Camera
    - Sound

executables:
  game-frontend-exe:
    main:         Main.hs
    source-dirs:  app
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - game-frontend

  game-server-exe:
    main:         Main.hs
    source-dirs:  server
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - game-frontend

tests:
  game-frontend-test:
    main:         Spec.hs
    source-dirs:  test
    ghc-options:
      - -threaded
    dependencies:
      - game-frontend
      - hspec
