name:                game-frontend
version:             0.1.0.0
synopsis:            A Haskell Game Frontend using Gloss
description:         Multiplayer game frontend built with the Gloss library
license:             MIT
author:              Developer
maintainer:          dev@example.com

dependencies:
  - base >= 4.7 && < 5
  - gloss
  - containers

library:
  source-dirs: src
  exposed-modules:
    - Types
    - AssetLoader
    - Input
    - GameLogic
    - NetworkClient
    - Render.Core
    - Render.Map
    - Render.UI
  dependencies:
    - network
    - stm
    - bytestring

executables:
  game-frontend-exe:
    main:         Main.hs
    source-dirs:  app
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - game-frontend

tests:
  game-frontend-test:
    main:         Spec.hs
    source-dirs:  test
    ghc-options:
      - -threaded
    dependencies:
      - game-frontend
      - hspec
